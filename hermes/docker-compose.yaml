services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    environment:
      HERMES_DASHBOARD: 1
      HERMES_DASHBOARD_HOST: 0.0.0.0
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_AUTH_USER}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_AUTH_PASSWORD}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_AUTH_SECRET}
    volumes:
      # bulk state: sessions, memories, skills, cron, hooks, logs, home/
      - hermes-data:/opt/data
      # config files, bind-mounted individually so they're directly editable/versionable on the host
      - /var/home/core/hermes/config.yaml:/opt/data/config.yaml
      - /var/home/core/hermes/hindsight/config.json:/opt/data/hindsight/config.json
      - /var/home/core/hermes/SOUL.md:/opt/data/SOUL.md
    labels:
      - "coredns.dockerdiscovery.host=hermes.home"
    networks:
      app-network:
        ipv4_address: 192.168.40.50

volumes:
  hermes-data:

networks:
  app-network:
    external: true
